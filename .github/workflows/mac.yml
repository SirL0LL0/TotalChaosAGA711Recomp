# Le versioni per macOS (Intel e chip Apple in un solo eseguibile) e Linux (x86_64).
#
# Il ricompilatore vuole l'immagine del gioco (build/chaos_immagine.bin e i
# file accanto), che non sta nel repository: e' nell'asset dati_build.zip della
# release in bozza "dati-build", visibile solo a chi puo' scrivere nel
# repository. Si rifa' da Windows con:
#   python game/prepara_immagine.py ... ; zip dei quattro file di build/ (vedi sotto)
#   gh release upload dati-build dati_build.zip --clobber
name: macOS e Linux

on:
  workflow_dispatch:
    inputs:
      versione:
        description: "versione (es. 1.1.0-beta1)"
        required: true
        default: "beta"
      release:
        description: "tag della release a cui allegare lo zip (vuoto: solo artifact)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      SDL_VER: 2.32.2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: dati del gioco per il ricompilatore
        run: |
          gh release download dati-build -p dati_build.zip -D /tmp
          mkdir -p build
          unzip -o /tmp/dati_build.zip -d build
          ls -l build

      - name: SDL2.framework (universale)
        run: |
          curl -sSL -o /tmp/sdl.dmg "https://github.com/libsdl-org/SDL/releases/download/release-$SDL_VER/SDL2-$SDL_VER.dmg"
          hdiutil attach /tmp/sdl.dmg -mountpoint /tmp/sdlvol -nobrowse -quiet
          mkdir -p "$HOME/sdl"
          if [ -d /tmp/sdlvol/SDL2.framework ]; then cp -R /tmp/sdlvol/SDL2.framework "$HOME/sdl/"
          else cp -R /tmp/sdlvol/SDL2.xcframework/macos-arm64_x86_64/SDL2.framework "$HOME/sdl/"; fi
          hdiutil detach /tmp/sdlvol -quiet
          ls "$HOME/sdl/SDL2.framework/Resources/CMake"
          brew list ninja >/dev/null 2>&1 || brew install ninja

      - name: build
        run: |
          cmake -S . -B build/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DSDL2_DIR="$HOME/sdl/SDL2.framework/Resources/CMake" \
            -DCMAKE_DISABLE_FIND_PACKAGE_Freetype=ON -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON
          cmake --build build/cmake

      - name: prove su Mac (installazione da Aminet, avvio, partite fra computer)
        run: |
          curl -sSL --retry 8 --retry-all-errors --retry-delay 10 -o /tmp/TotalChaosAGAr6.lha https://aminet.net/game/strat/TotalChaosAGAr6.lha
          export SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy
          export TC_DATI="$PWD/build/mac_install"
          build/cmake/TotalChaosAGA711Recomp --installa /tmp/TotalChaosAGAr6.lha 2>&1 | tail -3
          mkdir -p build/mac_giro/RAM && cd build/mac_giro
          AMIGA_QUADRI=1922 AMIGA_INGRESSI="p320.256:1,p569.14:700,l3:705,p600.15:850,l3:855,p592.14:1000,l3:1005" \
            AMIGA_ORA=1792000000 TC_RAM="$PWD/RAM" AMIGA_FOTO=1900 ../cmake/TotalChaosAGA711Recomp > out.txt 2> err.txt || echo "codice $?"
          tail -2 out.txt
          if grep -E "^\[(crash|errore)\]|DISPATCH MISS" err.txt; then exit 1; fi
          # la parte Intel dello stesso eseguibile, con Rosetta
          mkdir -p ../mac_giro_intel/RAM && cd ../mac_giro_intel
          AMIGA_QUADRI=1922 AMIGA_INGRESSI="p320.256:1,p569.14:700,l3:705,p600.15:850,l3:855,p592.14:1000,l3:1005" \
            AMIGA_ORA=1792000000 TC_RAM="$PWD/RAM" AMIGA_FOTO=1900 arch -x86_64 ../cmake/TotalChaosAGA711Recomp > out.txt 2> err.txt || echo "codice $?"
          tail -2 out.txt
          if grep -E "^\[(crash|errore)\]|DISPATCH MISS" err.txt; then exit 1; fi
          cd ../..
          TC_EXE="$PWD/build/cmake/TotalChaosAGA711Recomp" TC_DATI_ORIGINE="$TC_DATI" \
            python3 -I tools/prove_cpu.py -variati -seme 500 -n 2 -paralleli 2 -quadri 60000 -limite 1200 -cartella prove_mac \
            | grep -E "^partita" | tee /tmp/partite.txt
          if grep -E "crash|errore" /tmp/partite.txt; then exit 1; fi
          if grep -lE "^\[(crash|errore)\]|DISPATCH MISS" build/prove_mac/*/err.txt; then exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prove-mac
          path: |
            build/mac_giro/*.bmp
            build/mac_giro/err.txt
            build/mac_giro_intel/err.txt
            build/prove_mac/*/err.txt

      - name: pacchetto
        run: |
          D=TotalChaosAGA711Recomp
          sh tools/pacchetto_mac.sh build/cmake "$HOME/sdl/SDL2.framework" "${{ inputs.versione }}" $D
          if otool -L "$D/Total Chaos AGA.app/Contents/MacOS/TotalChaosAGA711Recomp" | grep -E "/opt/homebrew|/usr/local"; then
            echo "librerie di Homebrew nell'eseguibile"; exit 1; fi
          cp tools/LEGGIMI_mac.txt $D/
          ditto -c -k --sequesterRsrc --keepParent $D "TotalChaosAGA711Recomp-${{ inputs.versione }}-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: TotalChaosAGA711Recomp-${{ inputs.versione }}-macos
          path: TotalChaosAGA711Recomp-${{ inputs.versione }}-macos.zip

      - name: allega alla release
        if: ${{ inputs.release != '' }}
        run: gh release upload "${{ inputs.release }}" "TotalChaosAGA711Recomp-${{ inputs.versione }}-macos.zip" --clobber

  linux:
    # Ubuntu 22.04: l'eseguibile vuole una glibc non troppo nuova
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: dati del gioco per il ricompilatore
        run: |
          gh release download dati-build -p dati_build.zip -D /tmp
          mkdir -p build
          unzip -o /tmp/dati_build.zip -d build

      - name: build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang ninja-build libsdl2-dev libgl-dev
          cmake -S . -B build/cmake -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_DISABLE_FIND_PACKAGE_Freetype=ON -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON
          cmake --build build/cmake
          strip build/cmake/TotalChaosAGA711Recomp

      - name: prove (installazione da Aminet, avvio, partite fra computer)
        run: |
          curl -sSL --retry 8 --retry-all-errors --retry-delay 10 -o /tmp/TotalChaosAGAr6.lha https://aminet.net/game/strat/TotalChaosAGAr6.lha
          export SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy
          export TC_DATI="$PWD/build/linux_install"
          build/cmake/TotalChaosAGA711Recomp --installa /tmp/TotalChaosAGAr6.lha 2>&1 | tr '\r' '\n' | tail -2
          mkdir -p build/linux_giro/RAM && cd build/linux_giro
          AMIGA_QUADRI=1922 AMIGA_INGRESSI="p320.256:1,p569.14:700,l3:705,p600.15:850,l3:855,p592.14:1000,l3:1005" \
            AMIGA_ORA=1792000000 TC_RAM="$PWD/RAM" AMIGA_FOTO=1900 ../cmake/TotalChaosAGA711Recomp > out.txt 2> err.txt || echo "codice $?"
          tail -2 out.txt
          if grep -E "^\[(crash|errore)\]|DISPATCH MISS" err.txt; then exit 1; fi
          cd ../..
          TC_EXE="$PWD/build/cmake/TotalChaosAGA711Recomp" TC_DATI_ORIGINE="$TC_DATI" \
            python3 -I tools/prove_cpu.py -variati -seme 600 -n 2 -paralleli 2 -quadri 60000 -limite 1200 -cartella prove_linux \
            | grep -E "^partita" | tee /tmp/partite.txt
          if grep -E "crash|errore" /tmp/partite.txt; then exit 1; fi

      - name: pacchetto
        run: |
          D=TotalChaosAGA711Recomp
          mkdir -p $D
          cp build/cmake/TotalChaosAGA711Recomp build/cmake/tc_modifiche.bin $D/
          cp -R build/cmake/assets $D/
          cp tools/LEGGIMI_linux.txt $D/
          tar -czf "TotalChaosAGA711Recomp-${{ inputs.versione }}-linux-x86_64.tar.gz" $D

      - uses: actions/upload-artifact@v4
        with:
          name: TotalChaosAGA711Recomp-${{ inputs.versione }}-linux
          path: TotalChaosAGA711Recomp-${{ inputs.versione }}-linux-x86_64.tar.gz

      - name: allega alla release
        if: ${{ inputs.release != '' }}
        run: gh release upload "${{ inputs.release }}" "TotalChaosAGA711Recomp-${{ inputs.versione }}-linux-x86_64.tar.gz" --clobber